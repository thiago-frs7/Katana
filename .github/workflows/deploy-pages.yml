name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/ibasho-3d-pwa-planning-rgo5l1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara pasta pública (sem .git/.github)
        run: |
          mkdir -p _site
          shopt -s extglob dotglob
          cp -r !(.git|.github|_site) _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
