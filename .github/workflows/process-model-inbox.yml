name: Processa caixa de entrada de modelos 3D

on:
  push:
    branches: [main, claude/ibasho-3d-pwa-planning-rgo5l1]
    paths:
      - 'assets/models/_inbox/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-inbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organiza e reindexa modelos da caixa de entrada
        run: python3 tools/process_inbox.py
      - name: Publica as mudanças
        run: |
          git config user.name "ibasho-bot"
          git config user.email "actions@github.com"
          git add assets/models
          git diff --cached --quiet && echo "Nada novo pra publicar." || git commit -m "Organiza modelo(s) da caixa de entrada"
          git diff --cached --quiet || git push
